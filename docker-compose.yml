version: '3.8'

services:
  fog-monitor:
    build: .
    image: raychevbg/bulgaria-fog-monitor:latest
    container_name: bulgaria_fog_monitor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - .:/app